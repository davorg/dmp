<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 600" font-family="Helvetica, Arial, sans-serif">

  <rect x="0" y="0" width="520" height="600" fill="#ffffff"/>

  <!-- 1: an array, numeric index, square corners -->
  <g stroke="#cbd5e1" stroke-width="1.5" fill="#f8fafc">
    <rect x="20" y="20" width="170" height="80"/>
  </g>
  <g stroke="#cbd5e1" stroke-width="1">
    <line x1="20" y1="60" x2="190" y2="60"/>
    <line x1="60" y1="20" x2="60" y2="100"/>
  </g>
  <g font-size="16" fill="#1a1a2e">
    <text x="40" y="45" text-anchor="middle">0</text> <text x="75" y="45">element zero</text>
    <text x="40" y="85" text-anchor="middle">1</text> <text x="75" y="85">element one</text>
  </g>
  <text x="20" y="118" font-size="13" font-style="italic" fill="#64748b">An array: the left column is a numeric index, so the box has square corners.</text>

  <!-- 2: a hash, string keys, rounded corners -->
  <g stroke="#cbd5e1" stroke-width="1.5" fill="#f8fafc">
    <rect x="20" y="170" width="180" height="80" rx="10" ry="10"/>
  </g>
  <g stroke="#cbd5e1" stroke-width="1">
    <line x1="20" y1="210" x2="200" y2="210"/>
    <line x1="90" y1="170" x2="90" y2="250"/>
  </g>
  <g font-size="16" fill="#1a1a2e">
    <text x="35" y="195">key1</text> <text x="105" y="195">value one</text>
    <text x="35" y="235">key2</text> <text x="105" y="235">value two</text>
  </g>
  <text x="20" y="268" font-size="13" font-style="italic" fill="#64748b">A hash: the left column is a string key, so the box has rounded corners.</text>

  <!-- 3: a reference, a hash value pointing at a separate array -->
  <g stroke="#cbd5e1" stroke-width="1.5" fill="#f8fafc">
    <rect x="20" y="320" width="160" height="40" rx="10" ry="10"/>
  </g>
  <line x1="70" y1="320" x2="70" y2="360" stroke="#cbd5e1" stroke-width="1"/>
  <g font-size="16" fill="#1a1a2e">
    <text x="35" y="345">key</text> <text x="85" y="345" font-style="italic">arrayref</text>
  </g>
  <circle cx="160" cy="340" r="4" fill="#7c3aed"/>

  <g stroke="#cbd5e1" stroke-width="1.5" fill="#f8fafc">
    <rect x="300" y="320" width="170" height="80"/>
  </g>
  <g stroke="#cbd5e1" stroke-width="1">
    <line x1="300" y1="360" x2="470" y2="360"/>
    <line x1="340" y1="320" x2="340" y2="400"/>
  </g>
  <g font-size="16" fill="#1a1a2e">
    <text x="320" y="345" text-anchor="middle">0</text> <text x="355" y="345">element zero</text>
    <text x="320" y="385" text-anchor="middle">1</text> <text x="355" y="385">element one</text>
  </g>

  <path d="M 164 340 L 300 340" stroke="#7c3aed" stroke-width="1.5" fill="none"/>
  <polygon points="300,340 293,336.5 293,343.5" fill="#7c3aed"/>

  <text x="20" y="418" font-size="13" font-style="italic" fill="#64748b">A reference: a hash value can be an arrayref, a pointer (the dot) to a separate array.</text>

  <!-- 4: a faded reference, a target that exists but isn't drawn out -->
  <g stroke="#cbd5e1" stroke-width="1.5" fill="#f8fafc">
    <rect x="20" y="470" width="190" height="80" rx="10" ry="10"/>
  </g>
  <g stroke="#cbd5e1" stroke-width="1">
    <line x1="20" y1="510" x2="210" y2="510"/>
    <line x1="90" y1="470" x2="90" y2="550"/>
  </g>
  <g font-size="16" fill="#1a1a2e">
    <text x="35" y="495">key1</text> <text x="105" y="495">value one</text>
    <text x="35" y="535">key2</text> <text x="105" y="535" font-style="italic">hashref</text>
  </g>
  <circle cx="190" cy="530" r="4" fill="#7c3aed"/>
  <g stroke="#7c3aed" stroke-width="3" stroke-linecap="round">
    <line x1="198" y1="530" x2="205" y2="530" stroke-opacity="0.65"/>
    <line x1="211" y1="530" x2="218" y2="530" stroke-opacity="0.48"/>
    <line x1="224" y1="530" x2="231" y2="530" stroke-opacity="0.32"/>
    <line x1="237" y1="530" x2="244" y2="530" stroke-opacity="0.18"/>
    <line x1="250" y1="530" x2="257" y2="530" stroke-opacity="0.08"/>
  </g>
  <text x="20" y="568" font-size="13" font-style="italic" fill="#64748b">A faded reference: the dashes fade out when the target exists but isn't drawn.</text>

</svg>
