<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" font-family="Helvetica, Arial, sans-serif">

  <rect x="0" y="0" width="700" height="320" fill="#ffffff"/>

  <!-- Not one of the book's usual reference diagrams, no violet dots or
       arrows here. This traces the actual worked example in the text
       (encode_json({artist => 'Bjork'}), then two different ->decode
       calls on the same $bytes), colour-coded green for the call that
       gets the encoding right and red for the one that doesn't. -->

  <text x="350" y="16" font-size="13" font-style="italic" fill="#64748b" text-anchor="middle">The same $bytes, decoded two different ways</text>

  <!-- $bytes, the shared starting point -->
  <g stroke="#cbd5e1" stroke-width="1.5" fill="#f8fafc">
    <rect x="270" y="30" width="160" height="54" rx="8" ry="8"/>
  </g>
  <text x="350" y="55" font-size="15" font-weight="bold" fill="#1a1a2e" text-anchor="middle">UTF-8 bytes</text>
  <text x="350" y="73" font-size="12" fill="#64748b" text-anchor="middle">(from encode_json)</text>

  <!-- shared stem, then branch -->
  <path d="M 350 84 L 350 104" stroke="#64748b" stroke-width="1.5" fill="none"/>

  <!-- correct: decode_json -->
  <path d="M 350 104 L 140 104 L 140 193" stroke="#16a34a" stroke-width="1.5" fill="none"/>
  <polygon points="140,200 136.5,193 143.5,193" fill="#16a34a"/>
  <text x="140" y="126" font-size="13" font-family="Consolas, Menlo, monospace" fill="#166534" text-anchor="middle">decode_json($bytes)</text>

  <g stroke="#86efac" stroke-width="1.5" fill="#f0fdf4">
    <rect x="60" y="200" width="160" height="60" rx="8" ry="8"/>
  </g>
  <text x="140" y="226" font-size="16" font-weight="bold" fill="#166534" text-anchor="middle">Björk</text>
  <text x="140" y="246" font-size="12" fill="#166534" text-anchor="middle">5 chars — correct</text>

  <!-- wrong: JSON->new->decode without ->utf8 -->
  <path d="M 350 104 L 540 104 L 540 193" stroke="#dc2626" stroke-width="1.5" fill="none"/>
  <polygon points="540,200 536.5,193 543.5,193" fill="#dc2626"/>
  <text x="540" y="121" font-size="13" font-family="Consolas, Menlo, monospace" fill="#991b1b" text-anchor="middle">JSON->new->decode($bytes)</text>
  <text x="540" y="138" font-size="12" fill="#991b1b" text-anchor="middle">(no -&gt;utf8)</text>

  <g stroke="#fca5a5" stroke-width="1.5" fill="#fef2f2">
    <rect x="460" y="200" width="160" height="60" rx="8" ry="8"/>
  </g>
  <text x="540" y="226" font-size="16" font-weight="bold" fill="#991b1b" text-anchor="middle">BjÃ¶rk</text>
  <text x="540" y="246" font-size="12" fill="#991b1b" text-anchor="middle">6 chars — mojibake</text>

  <text x="350" y="295" font-size="12" fill="#64748b" text-anchor="middle">decode_json expects raw bytes; JSON-&gt;new-&gt;decode (without -&gt;utf8) expects text that's already decoded.</text>

</svg>
