<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 90 1300 300" font-family="Helvetica, Arial, sans-serif">

  <rect x="0" y="90" width="1300" height="300" fill="#ffffff"/>

  <!-- Every box (hash or array) is the same 170px width, sized from the
       widest box's own measured content (Header/hashref, Assign/arrayref)
       plus a consistent 15px pad on each side. Narrower boxes just carry
       more right-hand whitespace rather than shrinking to fit. The two
       branches out of the Section[0] hash (to Name, and to the Assign
       array) run the same 45px vertical distance in each direction, so
       the diagram balances around it. Every arrow's tip lands exactly
       on the edge of the box it points to. -->

  <!-- %/ top level: File -> hashref (hash -> rounded corners) -->
  <g stroke="#cbd5e1" stroke-width="1.5" fill="#f8fafc">
    <rect x="10" y="170" width="170" height="40" rx="10" ry="10"/>
  </g>
  <line x1="64" y1="170" x2="64" y2="210" stroke="#cbd5e1" stroke-width="1"/>
  <g font-size="15" fill="#1a1a2e">
    <text x="25" y="195">File</text> <text x="79" y="195" font-style="italic">hashref</text>
  </g>
  <circle cx="180" cy="190" r="4" fill="#7c3aed"/>

  <!-- File hash: Section -> arrayref -->
  <g stroke="#cbd5e1" stroke-width="1.5" fill="#f8fafc">
    <rect x="230" y="170" width="170" height="40" rx="10" ry="10"/>
  </g>
  <line x1="310" y1="170" x2="310" y2="210" stroke="#cbd5e1" stroke-width="1"/>
  <g font-size="15" fill="#1a1a2e">
    <text x="245" y="195">Section</text> <text x="325" y="195" font-style="italic">arrayref</text>
  </g>
  <circle cx="400" cy="190" r="4" fill="#7c3aed"/>

  <!-- Section array: index | hashref (array -> square corners); only index 0 followed -->
  <g stroke="#cbd5e1" stroke-width="1.5" fill="#f8fafc">
    <rect x="450" y="170" width="170" height="80"/>
  </g>
  <g stroke="#cbd5e1" stroke-width="1">
    <line x1="450" y1="210" x2="620" y2="210"/>
    <line x1="490" y1="170" x2="490" y2="250"/>
  </g>
  <g font-size="15" fill="#1a1a2e">
    <text x="470" y="195" text-anchor="middle">0</text> <text x="505" y="195" font-style="italic">hashref</text>
    <text x="470" y="235" text-anchor="middle">1</text> <text x="505" y="235" font-style="italic">hashref</text>
  </g>
  <circle cx="620" cy="190" r="4" fill="#7c3aed"/>
  <circle cx="620" cy="230" r="4" fill="#7c3aed"/>
  <!-- index 1 (the "rules" section) isn't followed further, same shape as index 0 -->
  <g stroke="#7c3aed" stroke-width="3" stroke-linecap="round">
    <line x1="628" y1="230" x2="635" y2="230" stroke-opacity="0.65"/>
    <line x1="641" y1="230" x2="648" y2="230" stroke-opacity="0.48"/>
    <line x1="654" y1="230" x2="661" y2="230" stroke-opacity="0.32"/>
    <line x1="667" y1="230" x2="674" y2="230" stroke-opacity="0.18"/>
    <line x1="680" y1="230" x2="687" y2="230" stroke-opacity="0.08"/>
  </g>

  <!-- Section[0] hash: Header -> hashref, Assign -> arrayref -->
  <g stroke="#cbd5e1" stroke-width="1.5" fill="#f8fafc">
    <rect x="670" y="170" width="170" height="80" rx="10" ry="10"/>
  </g>
  <g stroke="#cbd5e1" stroke-width="1">
    <line x1="670" y1="210" x2="840" y2="210"/>
    <line x1="751" y1="170" x2="751" y2="250"/>
  </g>
  <g font-size="15" fill="#1a1a2e">
    <text x="685" y="195">Header</text> <text x="766" y="195" font-style="italic">hashref</text>
    <text x="685" y="235">Assign</text> <text x="766" y="235" font-style="italic">arrayref</text>
  </g>
  <circle cx="840" cy="190" r="4" fill="#7c3aed"/>
  <circle cx="840" cy="230" r="4" fill="#7c3aed"/>

  <!-- Header hash: Name -> 'files' (terminal scalar, no further reference).
       Positioned 45px above the Section[0] hash's own vertical center
       (210), matching the Assign array's 45px below it. -->
  <g stroke="#cbd5e1" stroke-width="1.5" fill="#f8fafc">
    <rect x="890" y="125" width="170" height="40" rx="10" ry="10"/>
  </g>
  <line x1="961" y1="125" x2="961" y2="165" stroke="#cbd5e1" stroke-width="1"/>
  <g font-size="15" fill="#1a1a2e">
    <text x="905" y="150">Name</text> <text x="976" y="150">files</text>
  </g>

  <!-- Assign array: index | hashref (array -> square corners); only index 0 followed -->
  <g stroke="#cbd5e1" stroke-width="1.5" fill="#f8fafc">
    <rect x="890" y="255" width="170" height="120"/>
  </g>
  <g stroke="#cbd5e1" stroke-width="1">
    <line x1="890" y1="295" x2="1060" y2="295"/>
    <line x1="890" y1="335" x2="1060" y2="335"/>
    <line x1="930" y1="255" x2="930" y2="375"/>
  </g>
  <g font-size="15" fill="#1a1a2e">
    <text x="910" y="280" text-anchor="middle">0</text> <text x="945" y="280" font-style="italic">hashref</text>
    <text x="910" y="320" text-anchor="middle">1</text> <text x="945" y="320" font-style="italic">hashref</text>
    <text x="910" y="360" text-anchor="middle">2</text> <text x="945" y="360" font-style="italic">hashref</text>
  </g>
  <circle cx="1060" cy="275" r="4" fill="#7c3aed"/>
  <circle cx="1060" cy="315" r="4" fill="#7c3aed"/>
  <circle cx="1060" cy="355" r="4" fill="#7c3aed"/>
  <!-- indexes 1 and 2 (output/ext) aren't followed further, same shape as index 0 -->
  <g stroke="#7c3aed" stroke-width="3" stroke-linecap="round">
    <g>
      <line x1="1068" y1="315" x2="1075" y2="315" stroke-opacity="0.65"/>
      <line x1="1081" y1="315" x2="1088" y2="315" stroke-opacity="0.48"/>
      <line x1="1094" y1="315" x2="1101" y2="315" stroke-opacity="0.32"/>
      <line x1="1107" y1="315" x2="1114" y2="315" stroke-opacity="0.18"/>
      <line x1="1120" y1="315" x2="1127" y2="315" stroke-opacity="0.08"/>
    </g>
    <g>
      <line x1="1068" y1="355" x2="1075" y2="355" stroke-opacity="0.65"/>
      <line x1="1081" y1="355" x2="1088" y2="355" stroke-opacity="0.48"/>
      <line x1="1094" y1="355" x2="1101" y2="355" stroke-opacity="0.32"/>
      <line x1="1107" y1="355" x2="1114" y2="355" stroke-opacity="0.18"/>
      <line x1="1120" y1="355" x2="1127" y2="355" stroke-opacity="0.08"/>
    </g>
  </g>

  <!-- Assign[0] hash: Key -> 'input', Value -> 'data_in' (terminal scalars) -->
  <g stroke="#cbd5e1" stroke-width="1.5" fill="#f8fafc">
    <rect x="1110" y="255" width="170" height="80" rx="10" ry="10"/>
  </g>
  <g stroke="#cbd5e1" stroke-width="1">
    <line x1="1110" y1="295" x2="1280" y2="295"/>
    <line x1="1177" y1="255" x2="1177" y2="335"/>
  </g>
  <g font-size="15" fill="#1a1a2e">
    <text x="1125" y="280">Key</text>   <text x="1192" y="280">input</text>
    <text x="1125" y="320">Value</text> <text x="1192" y="320">data_in</text>
  </g>

  <!-- connecting arrows: each line stops 7px short of its target box so the
       arrowhead's tip lands exactly on the box edge, not floating in front
       of it -->
  <g stroke="#7c3aed" stroke-width="1.5" fill="none">
    <path d="M 184 190 L 223 190"/>
    <path d="M 404 190 L 443 190"/>
    <path d="M 624 190 L 663 190"/>
    <path d="M 844 190 L 865 190 L 865 145 L 883 145"/>
    <path d="M 844 230 L 865 230 L 865 275 L 883 275"/>
    <path d="M 1064 275 L 1103 275"/>
  </g>
  <g fill="#7c3aed">
    <polygon points="230,190 223,186.5 223,193.5"/>
    <polygon points="450,190 443,186.5 443,193.5"/>
    <polygon points="670,190 663,186.5 663,193.5"/>
    <polygon points="890,145 883,141.5 883,148.5"/>
    <polygon points="890,275 883,271.5 883,278.5"/>
    <polygon points="1110,275 1103,271.5 1103,278.5"/>
  </g>

</svg>
