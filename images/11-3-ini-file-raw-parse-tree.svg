<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1470 410" font-family="Helvetica, Arial, sans-serif">

  <rect x="0" y="0" width="1470" height="410" fill="#ffffff"/>

  <!-- %/ top level: File -> hashref (hash -> rounded corners).
       Box widths and internal margins are measured from actual glyph
       widths at this font/size (File 24px, hashref-italic ~55px, etc.),
       giving a consistent 15px pad: box edge -> label -> 15px -> divider
       -> 15px -> value -> 15px -> box edge. Top-aligned with the Section
       array's row 0 so the arrows into and out of it are flat. -->
  <g stroke="#cbd5e1" stroke-width="1.5" fill="#f8fafc">
    <rect x="10" y="170" width="139" height="40" rx="10" ry="10"/>
  </g>
  <line x1="64" y1="170" x2="64" y2="210" stroke="#cbd5e1" stroke-width="1"/>
  <g font-size="15" fill="#1a1a2e">
    <text x="25" y="195">File</text> <text x="79" y="195" font-style="italic">hashref</text>
  </g>
  <circle cx="149" cy="190" r="4" fill="#7c3aed"/>

  <!-- File hash: Section -> arrayref -->
  <g stroke="#cbd5e1" stroke-width="1.5" fill="#f8fafc">
    <rect x="199" y="170" width="167" height="40" rx="10" ry="10"/>
  </g>
  <line x1="279" y1="170" x2="279" y2="210" stroke="#cbd5e1" stroke-width="1"/>
  <g font-size="15" fill="#1a1a2e">
    <text x="214" y="195">Section</text> <text x="294" y="195" font-style="italic">arrayref</text>
  </g>
  <circle cx="366" cy="190" r="4" fill="#7c3aed"/>

  <!-- Section array: index | hashref (array -> square corners); only index 0 followed -->
  <g stroke="#cbd5e1" stroke-width="1.5" fill="#f8fafc">
    <rect x="440" y="170" width="140" height="80"/>
  </g>
  <g stroke="#cbd5e1" stroke-width="1">
    <line x1="440" y1="210" x2="580" y2="210"/>
    <line x1="480" y1="170" x2="480" y2="250"/>
  </g>
  <g font-size="15" fill="#1a1a2e">
    <text x="460" y="195" text-anchor="middle">0</text> <text x="495" y="195" font-style="italic">hashref</text>
    <text x="460" y="235" text-anchor="middle">1</text> <text x="495" y="235" font-style="italic">hashref</text>
  </g>
  <circle cx="580" cy="190" r="4" fill="#7c3aed"/>
  <circle cx="580" cy="230" r="4" fill="#7c3aed"/>
  <!-- index 1 (the "rules" section) isn't followed further, same shape as index 0 -->
  <g stroke="#7c3aed" stroke-width="3" stroke-linecap="round">
    <line x1="588" y1="230" x2="595" y2="230" stroke-opacity="0.65"/>
    <line x1="601" y1="230" x2="608" y2="230" stroke-opacity="0.48"/>
    <line x1="614" y1="230" x2="621" y2="230" stroke-opacity="0.32"/>
    <line x1="627" y1="230" x2="634" y2="230" stroke-opacity="0.18"/>
    <line x1="640" y1="230" x2="647" y2="230" stroke-opacity="0.08"/>
  </g>

  <!-- Section[0] hash: Header -> hashref, Assign -> arrayref -->
  <g stroke="#cbd5e1" stroke-width="1.5" fill="#f8fafc">
    <rect x="650" y="170" width="210" height="80" rx="10" ry="10"/>
  </g>
  <g stroke="#cbd5e1" stroke-width="1">
    <line x1="650" y1="210" x2="860" y2="210"/>
    <line x1="740" y1="170" x2="740" y2="250"/>
  </g>
  <g font-size="15" fill="#1a1a2e">
    <text x="665" y="195">Header</text> <text x="755" y="195" font-style="italic">hashref</text>
    <text x="665" y="235">Assign</text> <text x="755" y="235" font-style="italic">arrayref</text>
  </g>
  <circle cx="860" cy="190" r="4" fill="#7c3aed"/>
  <circle cx="860" cy="230" r="4" fill="#7c3aed"/>

  <!-- Header hash: Name -> 'files' (terminal scalar, no further reference) -->
  <g stroke="#cbd5e1" stroke-width="1.5" fill="#f8fafc">
    <rect x="1000" y="40" width="170" height="40" rx="10" ry="10"/>
  </g>
  <line x1="1070" y1="40" x2="1070" y2="80" stroke="#cbd5e1" stroke-width="1"/>
  <g font-size="15" fill="#1a1a2e">
    <text x="1015" y="65">Name</text> <text x="1085" y="65">files</text>
  </g>

  <!-- Assign array: index | hashref (array -> square corners); only index 0 followed -->
  <g stroke="#cbd5e1" stroke-width="1.5" fill="#f8fafc">
    <rect x="1000" y="260" width="150" height="120"/>
  </g>
  <g stroke="#cbd5e1" stroke-width="1">
    <line x1="1000" y1="300" x2="1150" y2="300"/>
    <line x1="1000" y1="340" x2="1150" y2="340"/>
    <line x1="1040" y1="260" x2="1040" y2="380"/>
  </g>
  <g font-size="15" fill="#1a1a2e">
    <text x="1020" y="285" text-anchor="middle">0</text> <text x="1055" y="285" font-style="italic">hashref</text>
    <text x="1020" y="325" text-anchor="middle">1</text> <text x="1055" y="325" font-style="italic">hashref</text>
    <text x="1020" y="365" text-anchor="middle">2</text> <text x="1055" y="365" font-style="italic">hashref</text>
  </g>
  <circle cx="1150" cy="280" r="4" fill="#7c3aed"/>
  <circle cx="1150" cy="320" r="4" fill="#7c3aed"/>
  <circle cx="1150" cy="360" r="4" fill="#7c3aed"/>
  <!-- indexes 1 and 2 (output/ext) aren't followed further, same shape as index 0 -->
  <g stroke="#7c3aed" stroke-width="3" stroke-linecap="round">
    <g>
      <line x1="1158" y1="320" x2="1165" y2="320" stroke-opacity="0.65"/>
      <line x1="1171" y1="320" x2="1178" y2="320" stroke-opacity="0.48"/>
      <line x1="1184" y1="320" x2="1191" y2="320" stroke-opacity="0.32"/>
      <line x1="1197" y1="320" x2="1204" y2="320" stroke-opacity="0.18"/>
      <line x1="1210" y1="320" x2="1217" y2="320" stroke-opacity="0.08"/>
    </g>
    <g>
      <line x1="1158" y1="360" x2="1165" y2="360" stroke-opacity="0.65"/>
      <line x1="1171" y1="360" x2="1178" y2="360" stroke-opacity="0.48"/>
      <line x1="1184" y1="360" x2="1191" y2="360" stroke-opacity="0.32"/>
      <line x1="1197" y1="360" x2="1204" y2="360" stroke-opacity="0.18"/>
      <line x1="1210" y1="360" x2="1217" y2="360" stroke-opacity="0.08"/>
    </g>
  </g>

  <!-- Assign[0] hash: Key -> 'input', Value -> 'data_in' (terminal scalars) -->
  <g stroke="#cbd5e1" stroke-width="1.5" fill="#f8fafc">
    <rect x="1250" y="260" width="200" height="80" rx="10" ry="10"/>
  </g>
  <g stroke="#cbd5e1" stroke-width="1">
    <line x1="1250" y1="300" x2="1450" y2="300"/>
    <line x1="1320" y1="260" x2="1320" y2="340"/>
  </g>
  <g font-size="15" fill="#1a1a2e">
    <text x="1265" y="285">Key</text>   <text x="1335" y="285">input</text>
    <text x="1265" y="325">Value</text> <text x="1335" y="325">data_in</text>
  </g>

  <!-- connecting arrows -->
  <g stroke="#7c3aed" stroke-width="1.5" fill="none">
    <path d="M 153 190 L 195 190"/>
    <path d="M 370 190 L 436 190"/>
    <path d="M 584 190 L 646 190"/>
    <path d="M 864 190 L 930 190 L 930 65 L 996 65"/>
    <path d="M 864 230 L 930 230 L 930 280 L 996 280"/>
    <path d="M 1154 280 L 1246 280"/>
  </g>
  <g fill="#7c3aed">
    <polygon points="195,190 188,186.5 188,193.5"/>
    <polygon points="436,190 429,186.5 429,193.5"/>
    <polygon points="646,190 639,186.5 639,193.5"/>
    <polygon points="996,65 989,61.5 989,68.5"/>
    <polygon points="996,280 989,276.5 989,283.5"/>
    <polygon points="1246,280 1239,276.5 1239,283.5"/>
  </g>

</svg>
