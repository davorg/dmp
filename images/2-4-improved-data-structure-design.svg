<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" font-family="Helvetica, Arial, sans-serif">

  <rect x="0" y="0" width="820" height="260" fill="#ffffff"/>

  <defs>
    <marker id="ref" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- %years hash: year | arrayref -->
  <g stroke="#cbd5e1" stroke-width="1.5" fill="#f8fafc">
    <rect x="10" y="20" width="230" height="200" rx="10" ry="10"/>
  </g>
  <g stroke="#cbd5e1" stroke-width="1">
    <line x1="10" y1="53.33" x2="240" y2="53.33"/>
    <line x1="10" y1="86.67" x2="240" y2="86.67"/>
    <line x1="10" y1="120" x2="240" y2="120"/>
    <line x1="10" y1="153.33" x2="240" y2="153.33"/>
    <line x1="10" y1="186.67" x2="240" y2="186.67"/>
    <line x1="110" y1="20" x2="110" y2="220"/>
  </g>
  <g font-size="15" fill="#1a1a2e">
    <text x="25" y="43">1971</text>  <text x="125" y="43" font-style="italic">arrayref</text>
    <text x="25" y="76">1987</text>  <text x="125" y="76" font-style="italic">arrayref</text>
    <text x="25" y="110">1993</text> <text x="125" y="110" font-style="italic">arrayref</text>
    <text x="25" y="143">1996</text> <text x="125" y="143" font-style="italic">arrayref</text>
    <text x="25" y="176">1997</text> <text x="125" y="176" font-style="italic">arrayref</text>
    <text x="25" y="210">1998</text> <text x="125" y="210" font-style="italic">arrayref</text>
  </g>
  <circle cx="222" cy="38" r="4" fill="#7c3aed"/>

  <!-- Every year maps to an arrayref, so every row gets a reference dot;
       only 1971's is followed all the way, and the rest fade out to show
       they point somewhere too (same treatment as Figure 2.5). -->
  <g fill="#7c3aed">
    <circle cx="222" cy="71" r="4"/>
    <circle cx="222" cy="105" r="4"/>
    <circle cx="222" cy="138" r="4"/>
    <circle cx="222" cy="171" r="4"/>
    <circle cx="222" cy="205" r="4"/>
  </g>
  <g stroke="#7c3aed" stroke-width="3" stroke-linecap="round">
    <g>
      <line x1="230" y1="71" x2="237" y2="71" stroke-opacity="0.65"/>
      <line x1="243" y1="71" x2="250" y2="71" stroke-opacity="0.48"/>
      <line x1="256" y1="71" x2="263" y2="71" stroke-opacity="0.32"/>
      <line x1="269" y1="71" x2="276" y2="71" stroke-opacity="0.18"/>
      <line x1="282" y1="71" x2="289" y2="71" stroke-opacity="0.08"/>
    </g>
    <g>
      <line x1="230" y1="105" x2="237" y2="105" stroke-opacity="0.65"/>
      <line x1="243" y1="105" x2="250" y2="105" stroke-opacity="0.48"/>
      <line x1="256" y1="105" x2="263" y2="105" stroke-opacity="0.32"/>
      <line x1="269" y1="105" x2="276" y2="105" stroke-opacity="0.18"/>
      <line x1="282" y1="105" x2="289" y2="105" stroke-opacity="0.08"/>
    </g>
    <g>
      <line x1="230" y1="138" x2="237" y2="138" stroke-opacity="0.65"/>
      <line x1="243" y1="138" x2="250" y2="138" stroke-opacity="0.48"/>
      <line x1="256" y1="138" x2="263" y2="138" stroke-opacity="0.32"/>
      <line x1="269" y1="138" x2="276" y2="138" stroke-opacity="0.18"/>
      <line x1="282" y1="138" x2="289" y2="138" stroke-opacity="0.08"/>
    </g>
    <g>
      <line x1="230" y1="171" x2="237" y2="171" stroke-opacity="0.65"/>
      <line x1="243" y1="171" x2="250" y2="171" stroke-opacity="0.48"/>
      <line x1="256" y1="171" x2="263" y2="171" stroke-opacity="0.32"/>
      <line x1="269" y1="171" x2="276" y2="171" stroke-opacity="0.18"/>
      <line x1="282" y1="171" x2="289" y2="171" stroke-opacity="0.08"/>
    </g>
    <g>
      <line x1="230" y1="205" x2="237" y2="205" stroke-opacity="0.65"/>
      <line x1="243" y1="205" x2="250" y2="205" stroke-opacity="0.48"/>
      <line x1="256" y1="205" x2="263" y2="205" stroke-opacity="0.32"/>
      <line x1="269" y1="205" x2="276" y2="205" stroke-opacity="0.18"/>
      <line x1="282" y1="205" x2="289" y2="205" stroke-opacity="0.08"/>
    </g>
  </g>

  <!-- single-element array: [0] -> hashref (array -> square corners) -->
  <g stroke="#cbd5e1" stroke-width="1.5" fill="#f8fafc">
    <rect x="330" y="20" width="140" height="33.33"/>
  </g>
  <line x1="363.33" y1="20" x2="363.33" y2="53.33" stroke="#cbd5e1" stroke-width="1"/>
  <text x="346.67" y="43" font-size="15" fill="#1a1a2e" text-anchor="middle">0</text>
  <text x="378.33" y="43" font-size="15" font-style="italic" fill="#1a1a2e">hashref</text>
  <circle cx="458" cy="38" r="4" fill="#7c3aed"/>

  <!-- CD hash: artist/title/label -->
  <g stroke="#cbd5e1" stroke-width="1.5" fill="#f8fafc">
    <rect x="560" y="20" width="250" height="100" rx="10" ry="10"/>
  </g>
  <g stroke="#cbd5e1" stroke-width="1">
    <line x1="560" y1="53.33" x2="810" y2="53.33"/>
    <line x1="560" y1="86.67" x2="810" y2="86.67"/>
    <line x1="650" y1="20" x2="650" y2="120"/>
  </g>
  <g font-size="15" fill="#1a1a2e">
    <text x="575" y="43">artist</text> <text x="665" y="43">David Bowie</text>
    <text x="575" y="76">title</text>  <text x="665" y="76">Hunky Dory</text>
    <text x="575" y="110">label</text> <text x="665" y="110">RCA</text>
  </g>

  <path d="M 226 38 L 330 38" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#ref)"/>
  <path d="M 462 38 L 560 38" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#ref)"/>

</svg>
