<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 320" font-family="Helvetica, Arial, sans-serif">

  <rect x="0" y="0" width="830" height="320" fill="#ffffff"/>

  <defs>
    <marker id="r32" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- @CD_and_year: index | arrayref (array -> square), top-aligned with the top-tier boxes -->
  <g stroke="#cbd5e1" stroke-width="1.5" fill="#f8fafc">
    <rect x="10" y="20" width="190" height="80"/>
  </g>
  <g stroke="#cbd5e1" stroke-width="1">
    <line x1="10" y1="60" x2="200" y2="60"/>
    <line x1="50" y1="20" x2="50" y2="100"/>
  </g>
  <g font-size="15" fill="#1a1a2e">
    <text x="30" y="45" text-anchor="middle">0</text> <text x="65" y="45" font-style="italic">arrayref</text>
    <text x="30" y="85" text-anchor="middle">1</text> <text x="65" y="85" font-style="italic">arrayref</text>
  </g>
  <circle cx="182" cy="40" r="4" fill="#7c3aed"/>
  <circle cx="182" cy="80" r="4" fill="#7c3aed"/>

  <!-- [0]: [1972, hashref] (array -> square) -->
  <g stroke="#cbd5e1" stroke-width="1.5" fill="#f8fafc">
    <rect x="300" y="20" width="160" height="80"/>
  </g>
  <g stroke="#cbd5e1" stroke-width="1">
    <line x1="300" y1="60" x2="460" y2="60"/>
    <line x1="340" y1="20" x2="340" y2="100"/>
  </g>
  <g font-size="15" fill="#1a1a2e">
    <text x="320" y="45" text-anchor="middle">0</text> <text x="355" y="45">1972</text>
    <text x="320" y="85" text-anchor="middle">1</text> <text x="355" y="85" font-style="italic">hashref</text>
  </g>
  <circle cx="452" cy="80" r="4" fill="#7c3aed"/>

  <!-- [1]: [1971, hashref] -->
  <g stroke="#cbd5e1" stroke-width="1.5" fill="#f8fafc">
    <rect x="300" y="220" width="160" height="80"/>
  </g>
  <g stroke="#cbd5e1" stroke-width="1">
    <line x1="300" y1="260" x2="460" y2="260"/>
    <line x1="340" y1="220" x2="340" y2="300"/>
  </g>
  <g font-size="15" fill="#1a1a2e">
    <text x="320" y="245" text-anchor="middle">0</text> <text x="355" y="245">1971</text>
    <text x="320" y="285" text-anchor="middle">1</text> <text x="355" y="285" font-style="italic">hashref</text>
  </g>
  <circle cx="452" cy="280" r="4" fill="#7c3aed"/>

  <!-- Ziggy Stardust / 1972 hash (hash -> rounded), top-aligned with the top-tier boxes -->
  <g stroke="#cbd5e1" stroke-width="1.5" fill="#f8fafc">
    <rect x="560" y="20" width="260" height="80" rx="10" ry="10"/>
  </g>
  <g stroke="#cbd5e1" stroke-width="1">
    <line x1="560" y1="60" x2="820" y2="60"/>
    <line x1="650" y1="20" x2="650" y2="100"/>
  </g>
  <g font-size="15" fill="#1a1a2e">
    <text x="575" y="45">year</text>  <text x="665" y="45">1972</text>
    <text x="575" y="85">title</text> <text x="665" y="85">Ziggy Stardust</text>
  </g>

  <!-- Hunky Dory / 1971 hash -->
  <g stroke="#cbd5e1" stroke-width="1.5" fill="#f8fafc">
    <rect x="560" y="220" width="260" height="80" rx="10" ry="10"/>
  </g>
  <g stroke="#cbd5e1" stroke-width="1">
    <line x1="560" y1="260" x2="820" y2="260"/>
    <line x1="650" y1="220" x2="650" y2="300"/>
  </g>
  <g font-size="15" fill="#1a1a2e">
    <text x="575" y="245">year</text>  <text x="665" y="245">1971</text>
    <text x="575" y="285">title</text> <text x="665" y="285">Hunky Dory</text>
  </g>

  <g stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#r32)">
    <path d="M 186 40 L 300 40"/>
    <path d="M 186 80 L 240 80 L 240 240 L 300 240"/>
    <path d="M 456 80 L 500 80 L 500 40 L 560 40"/>
    <path d="M 456 280 L 500 280 L 500 240 L 560 240"/>
  </g>

</svg>
