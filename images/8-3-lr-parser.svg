<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 650" font-family="Helvetica, Arial, sans-serif">

  <rect x="0" y="0" width="620" height="650" fill="#ffffff"/>

  <defs>
    <marker id="lr" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- arrows first, so box fills sit on top of the trunk overlaps -->
  <g stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#lr)">
    <path d="M 310 70 L 310 100 L 100 100 L 100 130"/>
    <path d="M 310 70 L 310 130"/>
    <path d="M 310 70 L 310 100 L 520 100 L 520 130"/>

    <path d="M 100 180 L 100 265 L 230 265"/>
    <path d="M 310 180 L 310 240"/>
    <path d="M 520 180 L 520 240"/>
    <path d="M 440 265 L 390 265"/>

    <path d="M 310 290 L 310 320 L 100 320 L 100 350"/>
    <path d="M 310 290 L 310 350"/>
    <path d="M 310 290 L 310 320 L 520 320 L 520 350"/>

    <path d="M 520 400 L 520 460"/>
    <path d="M 100 400 L 100 595 L 230 595"/>
    <path d="M 310 400 L 310 570"/>
    <path d="M 440 485 L 440 595 L 390 595"/>
  </g>

  <!-- Start / Finish (terminal states) -->
  <g fill="#0f766e">
    <rect x="230" y="20" width="160" height="50" rx="8" ry="8"/>
    <rect x="230" y="570" width="160" height="50" rx="8" ry="8"/>
  </g>
  <g font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <text x="310" y="50">Start</text>
    <text x="310" y="600">Finish</text>
  </g>

  <!-- state boxes -->
  <g stroke="#cbd5e1" stroke-width="1.5" fill="#f8fafc">
    <rect x="20"  y="130" width="160" height="50" rx="8" ry="8"/>
    <rect x="230" y="130" width="160" height="50" rx="8" ry="8"/>
    <rect x="440" y="130" width="160" height="50" rx="8" ry="8"/>

    <rect x="230" y="240" width="160" height="50" rx="8" ry="8"/>
    <rect x="440" y="240" width="160" height="50" rx="8" ry="8"/>

    <rect x="20"  y="350" width="160" height="50" rx="8" ry="8"/>
    <rect x="230" y="350" width="160" height="50" rx="8" ry="8"/>
    <rect x="440" y="350" width="160" height="50" rx="8" ry="8"/>

    <rect x="440" y="460" width="160" height="50" rx="8" ry="8"/>
  </g>
  <g font-size="15" fill="#1a1a2e" text-anchor="middle">
    <text x="100" y="160">PRONOUN</text>
    <text x="310" y="160">PROPER_NOUN</text>
    <text x="520" y="160">ARTICLE</text>

    <text x="310" y="270">VERB</text>
    <text x="520" y="270">NOUN</text>

    <text x="100" y="380">PRONOUN</text>
    <text x="310" y="380">PROPER_NOUN</text>
    <text x="520" y="380">ARTICLE</text>

    <text x="520" y="490">NOUN</text>
  </g>

</svg>
