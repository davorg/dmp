<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 400" font-family="Helvetica, Arial, sans-serif">

  <rect x="0" y="0" width="1060" height="400" fill="#ffffff"/>

  <defs>
    <marker id="r81" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- %data hash: title/date/CDs/count (hash -> rounded corners) -->
  <g stroke="#cbd5e1" stroke-width="1.5" fill="#f8fafc">
    <rect x="10" y="20" width="270" height="160" rx="10" ry="10"/>
  </g>
  <g stroke="#cbd5e1" stroke-width="1">
    <line x1="10" y1="60" x2="280" y2="60"/>
    <line x1="10" y1="100" x2="280" y2="100"/>
    <line x1="10" y1="140" x2="280" y2="140"/>
    <line x1="70" y1="20" x2="70" y2="180"/>
  </g>
  <g font-size="15" fill="#1a1a2e">
    <text x="25" y="45">title</text> <text x="85" y="45">Dave's CD collection</text>
    <text x="25" y="85">date</text>  <text x="85" y="85">16 Sep 1999</text>
    <text x="25" y="125">CDs</text> <text x="85" y="125" font-style="italic">arrayref</text>
    <text x="25" y="165">count</text> <text x="85" y="165">6</text>
  </g>
  <circle cx="260" cy="120" r="4" fill="#7c3aed"/>

  <!-- @{$data{CDs}} array: index | hashref (array -> square corners) -->
  <g stroke="#cbd5e1" stroke-width="1.5" fill="#f8fafc">
    <rect x="340" y="20" width="170" height="240"/>
  </g>
  <g stroke="#cbd5e1" stroke-width="1">
    <line x1="340" y1="60" x2="510" y2="60"/>
    <line x1="340" y1="100" x2="510" y2="100"/>
    <line x1="340" y1="140" x2="510" y2="140"/>
    <line x1="340" y1="180" x2="510" y2="180"/>
    <line x1="340" y1="220" x2="510" y2="220"/>
    <line x1="380" y1="20" x2="380" y2="260"/>
  </g>
  <g font-size="15" fill="#1a1a2e">
    <text x="360" y="45"  text-anchor="middle">0</text> <text x="395" y="45"  font-style="italic">hashref</text>
    <text x="360" y="85"  text-anchor="middle">1</text> <text x="395" y="85"  font-style="italic">hashref</text>
    <text x="360" y="125" text-anchor="middle">2</text> <text x="395" y="125" font-style="italic">hashref</text>
    <text x="360" y="165" text-anchor="middle">3</text> <text x="395" y="165" font-style="italic">hashref</text>
    <text x="360" y="205" text-anchor="middle">4</text> <text x="395" y="205" font-style="italic">hashref</text>
    <text x="360" y="245" text-anchor="middle">5</text> <text x="395" y="245" font-style="italic">hashref</text>
  </g>
  <circle cx="490" cy="40" r="4" fill="#7c3aed"/>
  <g fill="#7c3aed">
    <circle cx="490" cy="80" r="4"/>
    <circle cx="490" cy="120" r="4"/>
    <circle cx="490" cy="160" r="4"/>
    <circle cx="490" cy="200" r="4"/>
    <circle cx="490" cy="240" r="4"/>
  </g>
  <!-- rows 1-5 aren't followed further, but every hashref points somewhere;
       fading dashes (stepped opacity) suggest that without cluttering the
       diagram, same treatment as figures 2.4 and 2.5. -->
  <g stroke="#7c3aed" stroke-width="3" stroke-linecap="round">
    <g>
      <line x1="498" y1="80" x2="505" y2="80" stroke-opacity="0.65"/>
      <line x1="512" y1="80" x2="519" y2="80" stroke-opacity="0.48"/>
      <line x1="526" y1="80" x2="533" y2="80" stroke-opacity="0.32"/>
      <line x1="540" y1="80" x2="547" y2="80" stroke-opacity="0.18"/>
      <line x1="554" y1="80" x2="561" y2="80" stroke-opacity="0.08"/>
    </g>
    <g>
      <line x1="498" y1="120" x2="505" y2="120" stroke-opacity="0.65"/>
      <line x1="512" y1="120" x2="519" y2="120" stroke-opacity="0.48"/>
      <line x1="526" y1="120" x2="533" y2="120" stroke-opacity="0.32"/>
      <line x1="540" y1="120" x2="547" y2="120" stroke-opacity="0.18"/>
      <line x1="554" y1="120" x2="561" y2="120" stroke-opacity="0.08"/>
    </g>
    <g>
      <line x1="498" y1="160" x2="505" y2="160" stroke-opacity="0.65"/>
      <line x1="512" y1="160" x2="519" y2="160" stroke-opacity="0.48"/>
      <line x1="526" y1="160" x2="533" y2="160" stroke-opacity="0.32"/>
      <line x1="540" y1="160" x2="547" y2="160" stroke-opacity="0.18"/>
      <line x1="554" y1="160" x2="561" y2="160" stroke-opacity="0.08"/>
    </g>
    <g>
      <line x1="498" y1="200" x2="505" y2="200" stroke-opacity="0.65"/>
      <line x1="512" y1="200" x2="519" y2="200" stroke-opacity="0.48"/>
      <line x1="526" y1="200" x2="533" y2="200" stroke-opacity="0.32"/>
      <line x1="540" y1="200" x2="547" y2="200" stroke-opacity="0.18"/>
      <line x1="554" y1="200" x2="561" y2="200" stroke-opacity="0.08"/>
    </g>
    <g>
      <line x1="498" y1="240" x2="505" y2="240" stroke-opacity="0.65"/>
      <line x1="512" y1="240" x2="519" y2="240" stroke-opacity="0.48"/>
      <line x1="526" y1="240" x2="533" y2="240" stroke-opacity="0.32"/>
      <line x1="540" y1="240" x2="547" y2="240" stroke-opacity="0.18"/>
      <line x1="554" y1="240" x2="561" y2="240" stroke-opacity="0.08"/>
    </g>
  </g>

  <!-- Billy Bragg / Workers' Playtime hash (hash -> rounded corners) -->
  <g stroke="#cbd5e1" stroke-width="1.5" fill="#f8fafc">
    <rect x="620" y="20" width="310" height="200" rx="10" ry="10"/>
  </g>
  <g stroke="#cbd5e1" stroke-width="1">
    <line x1="620" y1="60" x2="930" y2="60"/>
    <line x1="620" y1="100" x2="930" y2="100"/>
    <line x1="620" y1="140" x2="930" y2="140"/>
    <line x1="620" y1="180" x2="930" y2="180"/>
    <line x1="710" y1="20" x2="710" y2="220"/>
  </g>
  <g font-size="15" fill="#1a1a2e">
    <text x="635" y="45">artist</text>   <text x="725" y="45">Billy Bragg</text>
    <text x="635" y="85">title</text>    <text x="725" y="85">Workers' Playtime</text>
    <text x="635" y="125">label</text>   <text x="725" y="125">Cooking Vinyl</text>
    <text x="635" y="165">released</text><text x="725" y="165">1988</text>
    <text x="635" y="205">tracks</text>  <text x="725" y="205" font-style="italic">arrayref</text>
  </g>
  <circle cx="910" cy="200" r="4" fill="#7c3aed"/>

  <!-- tracks array: 0/1 track titles (array -> square corners) -->
  <g stroke="#cbd5e1" stroke-width="1.5" fill="#f8fafc">
    <rect x="650" y="300" width="380" height="80"/>
  </g>
  <g stroke="#cbd5e1" stroke-width="1">
    <line x1="650" y1="340" x2="1030" y2="340"/>
    <line x1="690" y1="300" x2="690" y2="380"/>
  </g>
  <g font-size="15" fill="#1a1a2e">
    <text x="670" y="325" text-anchor="middle">0</text> <text x="705" y="325">She's Got A New Spell</text>
    <text x="670" y="365" text-anchor="middle">1</text> <text x="705" y="365">Must I Paint You A Picture</text>
  </g>

  <g stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#r81)">
    <path d="M 264 120 L 310 120 L 310 40 L 340 40"/>
    <path d="M 494 40 L 620 40"/>
    <path d="M 914 200 L 914 260 L 670 260 L 670 300"/>
  </g>

</svg>
